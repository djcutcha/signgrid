<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SignGrid K 学んだこと</title><link rel="stylesheet" href="ui.css"><link rel="stylesheet" href="k.css"></head>
<body data-page="k">
<script src="data.js"></script><script src="shell.js"></script>
<main class="page narrow" id="app">
  <div class="page-head"><div><h1>学んだこと</h1><div class="lead">有資格者の訂正から育った規則です。承認した規則だけが、次の下書きに効きます。</div></div></div>
  <div class="hero" id="hero" hidden><span class="big num" id="heroNum">0</span><span class="txt" id="heroTxt"></span></div>
  <p class="hint" id="summary" hidden></p>
  <div class="legend" id="legend" aria-label="札の意味" hidden>この画面の札:
    <span><span class="chip done">承認済み</span>下書きに効いている</span>
    <span><span class="chip draft">候補</span>訂正から生まれた、承認待ち</span>
    <span><span class="chip wait">矛盾の可能性</span>別の規則と食い違うかもしれない</span>
    <span><span class="chip no">却下</span>下書きには使わない</span>
  </div>
  <div class="by-line small muted" id="byLine" hidden></div>
  <section class="card" aria-label="規則の一覧"><div id="rules"><div class="empty"><b>読み込んでいます…</b></div></div></section>
  <details class="card rejected" id="rejected" hidden><summary id="rejSum"></summary><div id="rejList"></div></details>
</main>
<div class="dlg-back" id="byDlg"><div class="dlg" role="dialog" aria-modal="true" aria-labelledby="byTitle">
  <h3 id="byTitle">あなたの名前を入れてください</h3>
  <p class="small muted">承認・却下の記録に、この名前が残ります。この端末に覚えておきます。</p>
  <label class="f" for="byIn">名前(有資格者)</label>
  <input class="input" id="byIn" autocomplete="name" maxlength="40">
  <div class="row"><button class="btn ghost" id="byCancel" type="button">やめる</button><button class="btn primary" id="byOk" type="button">決める</button></div>
</div></div>
<div class="toast" id="toast" role="status"></div>
<script src="k.js"></script>
</body></html>
