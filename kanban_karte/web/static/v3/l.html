<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SignGrid 台帳</title><link rel="stylesheet" href="ui.css"><link rel="stylesheet" href="l.css"></head>
<body data-page="l">
<script src="data.js"></script>
<script>SG.TODAY = new Date().toLocaleDateString("ja-JP", { year: "numeric", month: "long", day: "numeric", weekday: "short" }); SG.COMPANY = "";</script>
<script src="shell.js"></script>
<main class="page">
  <div class="page-head"><div><h1>台帳</h1><p class="lead">発注元 &gt; チェーンブランド &gt; 店舗 &gt; 看板。選んだ所の中身を右に出します。</p></div></div>
  <p class="load-msg" id="loading" role="status">読み込んでいます…</p>
  <div class="err-box" id="error" role="alert" hidden>
    <b>台帳を読めませんでした</b><span id="errMsg"></span>
    <button type="button" class="btn sm" id="retry">もう一度読む</button>
  </div>
  <div class="ledger" id="ledger" hidden>
    <nav class="tree" aria-label="台帳の木">
      <details class="tw-d" id="treeWrap"><summary class="tw">木を開く</summary><div id="tree"></div></details>
    </nav>
    <section>
      <div class="tools"><input class="input" id="q" type="search" placeholder="看板名・店舗名で検索" aria-label="検索"><span class="small muted">札: <span class="chip draft">下書き</span> <span class="chip wait">確認待ち</span> <span class="chip done">確定</span></span></div>
      <div class="crumb" id="crumb"></div>
      <div class="table-wrap"><table class="t" id="tbl"></table><div class="foot-note" id="foot" hidden></div></div>
    </section>
  </div>
</main>
<script src="l.js"></script>
</body></html>
